<html>

<head>
    <script type='text/javascript' src='jquery-3.7.0.min.js'></script>
    <script type='text/javascript' src='knockout-3.5.1.js'></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <table class="channels-table">
        <thead>
            <tr>
                <th class="channels-table channels-table-header">Channel</th>
                <th class="channels-table channels-table-header">New</th>
                <th class="channels-table channels-table-header">Unwatched</th>
            </tr>
        </thead>
        <tbody data-bind="foreach: channels">
            <tr data-bind="css: { 'has-new': hasNew }">
                <td class="channels-table">
                    <a data-bind="attr: { href: videosUrl }" target=”_blank”>
                        <span data-bind="text: ($index() + 1)"></span>.
                        <span data-bind="text: title"></span>
                    </a>
                </td>
                <td class="channels-table channels-table-count">
                    <!-- ko if: hasNew -->
                    <span data-bind="text: newCount"></span>
                    <!-- /ko -->
                </td>
                <td class="channels-table channels-table-count">
                    <!-- ko if: hasChecked -->
                    <span data-bind="text: checkedCount"></span>
                    <!-- /ko -->
                </td>
            </tr>
        </tbody>
    </table>

    <button class="update-button" data-bind="text: updateButton.title, click: updateButton.onClick"></button>

    <script type='text/javascript'>
        function VM_UnwatchedChannel(vm) {
            var self = this;

            self.id = vm.id;
            self.title = vm.title;
            self.newCount = vm.new;
            self.checkedCount = vm.checked;

            self.hasNew = vm.new > 0;
            self.hasChecked = vm.checked > 0;

            self.videosUrl = "index.html?channelId=" + vm.id;
        };

        function VM_UpdateButton() {
            var self = this;

            self.onClick = function () {
                var request = {};
                self.title("Updating...");
                $.ajax({
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    'type': 'POST',
                    'url': "http://localhost:5000/api/videos/update_all_channels",
                    'data': JSON.stringify(request),
                    'dataType': 'json',
                    'success': function (response) {
                        self.title("Updated successfully - " + response.newVideosCount + " new video(s)");
                    },
                    'error': function (err) {
                        self.title("Update failed");
                        console.log(err);
                    }
                });
            };

            self.title = ko.observable("Update");
        };

        var myViewModel = {
            channels: ko.observable([]),

            updateButton: new VM_UpdateButton()
        };

        ko.applyBindings(myViewModel);

        $.getJSON("http://localhost:5000/api/channels/unwatched", function (viewModels) {
            var channels = [];
            for (viewModel of viewModels) {
                var channel = new VM_UnwatchedChannel(viewModel);
                channels.push(channel);
            }
            myViewModel.channels(channels);
        });
    </script>
</body>

</html>
