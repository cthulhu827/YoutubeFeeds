<html>

<head>
    <script type='text/javascript' src='jquery-3.7.0.min.js'></script>
    <script type='text/javascript' src='knockout-3.5.1.js'></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="page">
        <div id="channels">
            <table class="channels-table">
                <thead>
                    <tr>
                        <th class="channels-table channels-table-header">Channel</th>
                        <th class="channels-table channels-table-header">New</th>
                        <th class="channels-table channels-table-header">Unwatched</th>
                    </tr>
                </thead>
                <tbody data-bind="foreach: channels">
                    <tr data-bind="css: { 'has-new': hasNew }">
                        <td class="channels-table">
                            <a data-bind="attr: { href: videosUrl }" target=”_blank”>
                                <span data-bind="text: ($index() + 1)"></span>.
                                <span data-bind="text: title"></span>
                            </a>
                        </td>
                        <td class="channels-table channels-table-count">
                            <!-- ko if: hasNew -->
                            <span data-bind="text: newCount"></span>
                            <!-- /ko -->
                        </td>
                        <td class="channels-table channels-table-count">
                            <!-- ko if: hasChecked -->
                            <span data-bind="text: checkedCount"></span>
                            <!-- /ko -->
                        </td>
                    </tr>
                </tbody>
            </table>

            <button class="update-button" data-bind="text: updateButton.title, click: updateButton.onClick"></button>
        </div>
        <div id="videos">
            <div class="flex-wrapper" data-bind="foreach: videos">
                <div class="item" data-bind="class: statusClass">
                    <div class="item-header">
                        <div data-bind="if: isUpdating" class="item-loading">
                            <img src="loading.gif" />
                        </div>
						<div class="item-buttons">
							<span data-bind="text: isShort"></span>
						</div>
                        <div class="item-buttons" data-bind="foreach: vmStatuses">
                            <!-- ko if: isApplied -->
                            <span data-bind="text: spanText"></span>
                            <!-- /ko -->
                            <!-- ko ifnot: isApplied -->
                            <button class="item-button" type="button"
                                data-bind="text: buttonText, click: onClick"></button>
                            <!-- /ko -->
                        </div>
                    </div>
                    <div class="item-video">
                        <a data-bind="attr: { href: videoUrl }" target=”_blank”>
                            <img class="item-video-img" data-bind="attr:{src:previewUrl}" />
                        </a>
                    </div>
                    <div class="item-title">
                        <a data-bind="attr: { href: videoUrl }" target=”_blank”>
                            <span data-bind="text: title"></span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type='text/javascript'>
        function VM_Status(value, spanText, buttonText) {
            var self = this;
            self.value = value;
            self.spanText = spanText;
            self.buttonText = buttonText;
        };

        function VM_Video(vm) {
            var self = this;

            self.id = vm.id;
            self.title = vm.title;
            self.previewUrl = vm.previewUrl;
            self.videoUrl = vm.videoUrl;
            self.isShort = vm.isShort ? "Shorts" : "";
            self.status = ko.observable(vm.status);

            self.isUpdating = ko.observable(false);

            self.vmStatuses = [
                new VM_Status(1, "Checked", "Check"),
                new VM_Status(2, "Viewed", "View"),
                new VM_Status(4, "Skipped", "Skip")
            ];
            for (vmStatus of self.vmStatuses) {
                const closure = vmStatus.value;

                vmStatus.isApplied = ko.computed(function () {
                    return closure == self.status();
                });

                vmStatus.onClick = function () {
                    var request = {
                        id: self.id,
                        status: closure
                    };

                    self.isUpdating(true);
                    $.ajax({
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        'type': 'POST',
                        'url': "http://localhost:5000/api/videos/update_status",
                        'data': JSON.stringify(request),
                        'dataType': 'json',
                        'success': function (response) {
                            self.isUpdating(false);
                            self.status(response.newStatus);
                        },
                        'error': function () {
                            self.isUpdating(false);
                        }
                    });
                };
            }

            self.statusClass = ko.computed(function () {
                switch (self.status()) {
                    case 1:
                        return "video-status-checked";
                    case 2:
                        return "video-status-viewed";
                    case 4:
                        return "video-status-skipped";
                    default:
                        return "video-status-new";
                }
            });
        };

        function VM_UnwatchedChannel(vm) {
            var self = this;

            self.id = vm.id;
            self.title = vm.title;
            self.newCount = vm.new;
            self.checkedCount = vm.checked;

            self.hasNew = vm.new > 0;
            self.hasChecked = vm.checked > 0;

            self.videosUrl = "index.html?channelId=" + vm.id;
        };

        function VM_UpdateButton() {
            var self = this;

            self.onClick = function () {
                var request = {};
                self.title("Updating...");
                $.ajax({
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    'type': 'POST',
                    'url': "http://localhost:5000/api/videos/update_all_channels",
                    'data': JSON.stringify(request),
                    'dataType': 'json',
                    'success': function (response) {
                        self.title("Updated successfully - " + response.newVideosCount + " new video(s)");
                    },
                    'error': function (err) {
                        self.title("Update failed");
                        console.log(err);
                    }
                });
            };

            self.title = ko.observable("Update");
        };

        var myViewModel = {
            videos: ko.observable([]),
            channels: ko.observable([]),
            updateButton: new VM_UpdateButton()
        };

        ko.applyBindings(myViewModel);

        const urlParams = new URLSearchParams(window.location.search);
        const channelId = urlParams.get('channelId');
        console.log("Channel ID = %s", channelId);

        if (channelId != null) {
            var url = "http://localhost:5000/api/videos/all/" + channelId;
            $.getJSON(url, function (viewModels) {
                var videos = [];
                for (viewModel of viewModels) {
                    var video = new VM_Video(viewModel);
                    videos.push(video);
                }
                myViewModel.videos(videos);
            });
        }

        $.getJSON("http://localhost:5000/api/channels/unwatched", function (viewModels) {
            var channels = [];
            for (viewModel of viewModels) {
                var channel = new VM_UnwatchedChannel(viewModel);
                channels.push(channel);
            }
            myViewModel.channels(channels);
        });
    </script>
</body>

</html>
